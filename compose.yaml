name: catalog-test

x-python: &python
  image: catalog-test-python
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment: &python-env
    DATABASE_URL: postgresql://catalog:${POSTGRES_PASSWORD}@postgres:5432/catalog
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  read_only: true
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U catalog -d catalog]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: catalog-test-minio
    build: ./infra/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *python
    command: python -m app.migrate
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  api:
    <<: *python
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    <<: *python
    command: uvicorn bot.main:app --host 0.0.0.0 --port 8001 --no-access-log
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    build: ./frontend
    image: catalog-test-web
    read_only: true
    init: true

  tests:
    <<: *python
    image: catalog-test-tests
    build:
      context: ./backend
      target: test
    profiles: [tools]
    command: python -m tests
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${PORT:-8095}:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: {condition: service_healthy}
      bot: {condition: service_started}
      web: {condition: service_started}

volumes:
  postgres-data:
  minio-data:
