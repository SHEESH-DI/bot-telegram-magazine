resolver 127.0.0.11 valid=5s ipv6=off;
upstream catalog_api {
    zone catalog_api 64k;
    server api:8000 resolve;
}
upstream catalog_bot {
    zone catalog_bot 64k;
    server bot:8001 resolve;
}
upstream catalog_web {
    zone catalog_web 64k;
    server web:3000 resolve;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    location /api/ { proxy_pass http://catalog_api; }
    location = /health { proxy_pass http://catalog_api; }
    location = /telegram/webhook {
        proxy_next_upstream off;
        proxy_pass http://catalog_bot;
    }
    location / { proxy_pass http://catalog_web; }
}
